<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Black Jack</title>
        <link rel="stylesheet" href="blackjack.css">
        <script src="blackjack.js"></script>
    </head>
    
    <div id="game-info">
        <h3 id="coins-display"></h3>
        <h3 id="bet-display"></h3>
    </div>
    
    <body>
        <h2>Dealer: <span id="dealer-sum"></span></h2>
        <div id="dealer-cards">
            <img id="hidden" src="./cards/BACK.png">
        </div>

        <h2>You: <span id="your-sum"></span></h2>
        <div id="your-cards"></div>

        <br>
        <div id="controls">
            <button id="hit">Ziehen</button>
            <button id="stay">Halten</button>
            <button id="new-game">Neues Spiel</button>
            <button id="back-to-bet">Neue Runde</button>
        </div>
        <p id="results"></p>
    </body>
</html>
